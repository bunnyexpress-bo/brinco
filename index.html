<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6f7d">
<title>Brinco · Bunny Express</title>
<style>
  /* Herramienta de mostrador: una columna, botones grandes, color = destino */
  :root {
    --tinta: #0f3d40; --tinta-suave: #4a6b6d; --fondo: #f4eedd; --papel: #fffdf6;
    --linea: #e0d6bc; --acento: #0b7786; --acento-osc: #085e69; --oro: #e9b23c; --oro-osc: #c9921c;
    --marca: #0b6f7d; --marca-osc: #0f3d40;
    --bien: #1a7f4b; --mal: #b3261e; --aviso: #9a6700; --aviso-fondo: #fff4d6;
    --radio: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--tinta); }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  #app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  header.barra { position: sticky; top: 0; z-index: 5; background: var(--marca); border-bottom: 3px solid var(--oro); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  header.barra .marca { font-weight: 900; letter-spacing: .02em; font-size: 20px; color: var(--oro); }
  header.barra .lugar { margin-left: auto; background: var(--marca-osc); border: 0; color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 14px; max-width: 60%; }
  main { flex: 1; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 14px; }
  nav.pestanas { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; background: var(--marca-osc); border-top: 0; display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.pestanas .dentro { display: flex; width: 100%; max-width: 640px; }
  nav.pestanas button { flex: 1; background: none; border: 0; padding: 12px 4px 10px; font-size: 13px; font-weight: 600; color: #bcd6d4; border-top: 3px solid transparent; }
  nav.pestanas button.activa { color: var(--oro); border-top-color: var(--oro); }

  h1 { font-size: 22px; margin: 0; text-wrap: balance; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0; }
  .suave { color: var(--tinta-suave); font-size: 14px; }
  .fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .fila > .crece { flex: 1; min-width: 0; }
  .pila { display: flex; flex-direction: column; gap: 10px; }
  .tarjeta { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .tarjeta.toca { cursor: pointer; }
  .tarjeta.toca:active { background: #f3ecd9; }

  label.campo { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600; }
  input[type=text], input[type=email], input[type=password], input[type=tel], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 12px; border: 1.5px solid var(--linea); border-radius: 10px; background: #fff; font-weight: 400; min-height: 48px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(233,178,60,.6); outline-offset: 1px; border-color: var(--oro); }
  input[type=date] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; }
  input.codigo { font-size: 26px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; text-align: center; }
  .marca-check { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; min-height: 40px; }
  .marca-check input { width: 22px; height: 22px; accent-color: var(--acento); flex: none; }

  .btn { border: 0; border-radius: 10px; padding: 14px 16px; font-weight: 700; min-height: 50px; background: var(--acento); color: #fff; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { background: var(--acento-osc); }
  .btn[disabled] { opacity: .5; }
  .btn.ancho { width: 100%; }
  .btn.sec { background: var(--papel); color: var(--tinta); border: 1.5px solid var(--linea); }
  .btn.oscuro { background: var(--tinta); }
  .btn.oro { background: var(--oro); color: var(--marca-osc); font-size: 18px; min-height: 58px; }
  .btn.oro:active { background: var(--oro-osc); }
  .btn.verde { background: var(--bien); }
  .btn.rojo { background: #fff; color: var(--mal); border: 1.5px solid var(--mal); }
  .btn.chico { min-height: 38px; padding: 8px 12px; font-size: 14px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #efe8d4; white-space: nowrap; }
  .chip .punto { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.estado-pendiente { background: #e3f1ea; color: var(--bien); }
  .chip.estado-en_camino { background: var(--aviso-fondo); color: var(--aviso); }
  .chip.estado-entregado { background: #e7eeec; color: var(--tinta-suave); }
  .chip.estado-devuelto, .chip.estado-anulado { background: #f9e3e1; color: var(--mal); }
  .cod { font-weight: 800; font-size: 19px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .destino-grande { border-radius: 10px; padding: 12px; color: #fff; font-weight: 800; font-size: 18px; text-align: center; }
  .aviso-caja { background: var(--aviso-fondo); color: #5c3d00; border-radius: 10px; padding: 12px; font-size: 14px; }
  .error-caja { background: #f9e3e1; color: var(--mal); border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; }
  .ok-caja { background: #e3f1ea; color: var(--bien); border-radius: 10px; padding: 12px; font-weight: 700; }
  .lista-simple { display: flex; flex-direction: column; }
  .lista-simple > * { padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .lista-simple > *:last-child { border-bottom: 0; }
  .fotos { display: flex; gap: 8px; overflow-x: auto; }
  .fotos img { height: 150px; border-radius: 8px; border: 1px solid var(--linea); }
  .vista-previa { max-height: 120px; border-radius: 8px; align-self: flex-start; }
  canvas.firma { width: 100%; height: 180px; background: #fff; border: 2px dashed var(--linea); border-radius: 10px; touch-action: none; }
  pre.mensaje { white-space: pre-wrap; word-break: break-word; background: #f3ecd9; border-radius: 10px; padding: 12px; margin: 0; font: 14px/1.45 system-ui, sans-serif; }
  .numero-grande { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .rejilla2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dias { display: flex; gap: 6px; flex-wrap: wrap; }
  .dias label { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 600; gap: 2px; }
  .dias input { width: 22px; height: 22px; accent-color: var(--acento); }

  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 12px 16px; border-radius: 10px; max-width: min(92vw, 560px); z-index: 30; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #toast.mal { background: var(--mal); }
  #toast.bien { background: var(--bien); }
  .velo { position: fixed; inset: 0; background: rgba(15,61,64,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .hoja { background: var(--papel); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .centro { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 14px; max-width: 420px; margin: 0 auto; }
  .logo { font-size: 44px; font-weight: 900; letter-spacing: -.02em; color: var(--oro); }
  .logo span { color: #fff; }
  .portada { min-height: 100vh; background: var(--marca); display: flex; align-items: center; }
  .portada .centro { min-height: 0; width: 100%; }
  .portada .lema { color: #d4ebe9; }
  .portada .pila { background: var(--papel); border-radius: 16px; padding: 18px; }
  .paleta { display: flex; flex-wrap: wrap; gap: 8px; }
  .paleta button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--linea); cursor: pointer; }
  .paleta button.elegido { box-shadow: 0 0 0 3px var(--tinta); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* =====================================================================
   BRINCO · por Bunny Express — App del mostrador · Etapa 1
   Un solo archivo. Se conecta a la base de datos BRINCO en Supabase.
   ===================================================================== */
const CONFIG = {
  url: "https://dhlwluyskvzikqblvzsj.supabase.co",
  llave: "sb_publishable_sXZQXvFOX9xRicQAX4tDKA_DgebFx02",   // llave pública (no es secreta)
  prefijoPais: "591"
};

const PERMISOS = [
  ["anular", "Anular paquetes"],
  ["entregar_sin_codigo", "Entregar sin código de retiro"],
  ["configurar", "Configurar puntos, letras, feriados y ajustes"],
  ["ver_historial", "Ver el historial"],
  ["limpiar_fotos", "Limpiar fotos antiguas"],
  ["cambiar_precio", "Hacer descuentos"],
  ["ver_caja", "Ver la caja de todos los trabajadores"]
];
const PALETA = ["#0B7786", "#0F3D40", "#E9B23C", "#E07A00", "#C0392B", "#D63384", "#8E44AD", "#1F6FEB", "#1E9E5A", "#0E8C8C", "#A0522D", "#6B7280"];
const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const ESTADOS = { pendiente: "Pendiente", en_camino: "En camino", entregado: "Entregado", devuelto: "Devuelto", anulado: "Anulado" };

const sb = window.supabase.createClient(CONFIG.url, CONFIG.llave);
const E = { sesion: null, perfil: null, lugares: [], series: [], ajustes: {}, lugarId: null, pestana: "recibir", lote: null };

/* ---------- utilidades ---------- */
function h(tag, attrs, ...hijos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k in el && k !== "list" && k !== "form") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of hijos.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function pon(el, ...nodos) { el.replaceChildren(...nodos.flat(Infinity).filter(n => n !== null && n !== undefined && n !== false)); }
const $app = document.getElementById("app");
let toastT = null;
function toast(msg, tipo) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = tipo || ""; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, tipo === "mal" ? 6000 : 3000);
}
function traducir(m) {
  m = String(m || "");
  if (/paquetes_codigo_activo/.test(m)) return "Ya hay un paquete activo con ese código.";
  if (/row-level security|permission denied/i.test(m)) return "No tienes permiso para hacer esto.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Sin conexión a internet. Intenta de nuevo.";
  if (/Invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos.";
  if (/Too Many Requests|rate limit/i.test(m)) return "Demasiadas consultas. Espera unos minutos y vuelve a intentar.";
  if (/paquetes_codigo_check/.test(m)) return "El código debe ser letras y luego números, por ejemplo Q0251.";
  if (/telefono_check|cliente_tel_check/.test(m)) return "El celular debe tener solo números (6 a 15 dígitos).";
  if (/lugares_nombre_key/.test(m)) return "Ya existe un lugar con ese nombre.";
  if (/series_pkey/.test(m)) return "Esa letra ya está asignada a un lugar.";
  if (/feriados_pkey/.test(m)) return "Ese feriado ya está en la lista.";
  return m;
}
function ok(res) { if (res.error) throw new Error(traducir(res.error.message)); return res.data; }
async function intentar(fn, boton) {
  if (boton) boton.disabled = true;
  try { return await fn(); }
  catch (e) { console.error(e); toast(traducir(e.message), "mal"); return undefined; }
  finally { if (boton) boton.disabled = false; }
}
const fmtFecha = new Intl.DateTimeFormat("es-BO", { timeZone: "America/La_Paz", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
function bs(n) { n = Number(n) || 0; return "Bs " + (Number.isInteger(n) ? String(n) : n.toFixed(2).replace(".", ",")); }
function numero(t) { const n = Number(String(t ?? "").replace(",", ".").trim()); return Number.isFinite(n) ? n : NaN; }
function segmentado(id, opciones, inicial) {
  let valor = inicial;
  const botones = opciones.map(([v, t]) => h("button", { type: "button", id: id + "-" + v, class: "btn chico " + (v === inicial ? "" : "sec"), style: "flex:1",
    onclick: () => { valor = v; botones.forEach((b, i) => { b.className = "btn chico " + (opciones[i][0] === v ? "" : "sec"); }); } }, t));
  return { nodo: h("div", { class: "fila", role: "group" }, botones.map(b => h("span", { class: "crece", style: "display:flex" }, b))),
           valor: () => valor, poner: v => { const i = opciones.findIndex(o => o[0] === v); if (i >= 0) botones[i].click(); } };
}
const MOMENTOS = { al_dejar: "al dejar", despues: "después", al_recoger: "al recoger", devolucion: "devolución", descuento: "descuento" };
function lineasCobro(c) {
  return [
    h("div", { class: "fila" }, h("span", { class: "crece" }, (c.tamano === "grande" ? "Grande" : "Normal") + " · " + c.origen),
      h("span", { class: "suave" }, `${bs(c.base)} por ${c.incluidos} días + ${bs(c.extra_dia)}/día`)),
    h("div", { class: "fila" }, h("span", { class: "crece" }, `${c.dias} día(s) cobrables` + (c.dias_extra ? ` · ${c.dias_extra} extra` : "")),
      h("span", {}, "Total ", h("strong", {}, bs(c.total)))),
    h("div", { class: "fila" }, h("span", { class: "crece" }, "Pagado " + bs(c.pagado)),
      Number(c.falta) > 0 ? h("strong", { style: "color:var(--mal)" }, "Falta " + bs(c.falta)) : h("strong", { style: "color:var(--bien)" }, "Pagado ✓"))];
}
const fmtHora = new Intl.DateTimeFormat("es-BO", { timeZone: "America/La_Paz", hour: "2-digit", minute: "2-digit", hour12: false });
function hora(s) { return s ? fmtHora.format(new Date(s)) : ""; }
function fecha(s) { return s ? fmtFecha.format(new Date(s)) : ""; }
function diasDesde(s) { return Math.floor((Date.now() - new Date(s).getTime()) / 86400000); }
function lugaresDeTrabajo() { return E.lugares.filter(l => l.activo && l.tipo !== "destino"); }
function lugar(id) { return E.lugares.find(l => l.id === id) || { nombre: "?", color: "#888" }; }
function puede(p) { return !!E.perfil && (E.perfil.rol === "admin" || (E.perfil.permisos || []).includes(p)); }
function ajusteNum(clave, defecto) { const n = Number(E.ajustes[clave]); return E.ajustes[clave] !== undefined && Number.isFinite(n) ? n : defecto; }
function limpiarCodigo(s) { return String(s || "").toUpperCase().replace(/[\s-]/g, ""); }
function soloDigitos(s) { return String(s || "").replace(/\D/g, ""); }
function chipLugar(id, texto) { const l = lugar(id); return h("span", { class: "chip" }, h("span", { class: "punto", style: "background:" + l.color }), texto || l.nombre); }
function chipEstado(e) { return h("span", { class: "chip estado-" + e }, ESTADOS[e] || e); }
function siguienteCodigo(c) {
  const m = /^([A-Z]+)(\d+)$/.exec(c || ""); if (!m) return "";
  return m[1] + String(Number(m[2]) + 1).padStart(m[2].length, "0");
}
function destinoDeCodigo(c) {
  const m = /^([A-Z]+)/.exec(limpiarCodigo(c)); if (!m) return null;
  const s = E.series.find(x => x.letra === m[1] && x.activo); return s ? s.lugar_id : null;
}
function baseApp() { return location.origin + location.pathname; }
function enlaceVendedora(v) { return v && v.enlace ? baseApp() + "?v=" + v.enlace : ""; }
function enlaceConsulta(retiro) { return baseApp() + "?c=" + retiro; }
async function copiar(texto, aviso) {
  try { await navigator.clipboard.writeText(texto); toast(aviso || "Copiado", "bien"); return true; }
  catch { toast("No se pudo copiar. Mantén presionado el texto para copiarlo.", "mal"); return false; }
}
function telWhatsapp(t) { t = soloDigitos(t); return t.length === 8 ? CONFIG.prefijoPais + t : t; }

/* ---------- ventana de formulario ---------- */
function hoja(titulo, contenido, alCerrar) {
  const velo = h("div", { class: "velo" });
  const cerrar = () => { velo.remove(); if (alCerrar) alCerrar(); };
  velo.addEventListener("click", e => { if (e.target === velo) cerrar(); });
  velo.append(h("div", { class: "hoja" },
    h("div", { class: "fila" }, h("h2", { class: "crece" }, titulo), h("button", { class: "btn sec chico", onclick: cerrar }, "Cerrar")),
    contenido));
  document.body.append(velo);
  return cerrar;
}
/* campos: [{clave, etiqueta, tipo: text|tel|number|date|color|check|select|dias|multi|area, opciones, ayuda, obligatorio}] */
function formulario(titulo, campos, inicial, textoBoton) {
  return new Promise(resolver => {
    const ctl = {}; let resuelto = false;
    const cuerpo = h("div", { class: "pila" });
    for (const c of campos) {
      const v = inicial && inicial[c.clave] !== undefined ? inicial[c.clave] : c.defecto;
      let nodo;
      if (c.tipo === "check") {
        const i = h("input", { type: "checkbox", checked: !!v, id: "f-" + c.clave }); ctl[c.clave] = () => i.checked;
        nodo = h("label", { class: "marca-check" }, i, c.etiqueta);
      } else if (c.tipo === "select") {
        const s = h("select", { id: "f-" + c.clave }, c.opciones.map(([val, txt]) => h("option", { value: String(val) }, txt)));
        s.value = v === null || v === undefined ? "" : String(v); ctl[c.clave] = () => s.value;
        nodo = h("label", { class: "campo" }, c.etiqueta, s);
      } else if (c.tipo === "dias") {
        const cs = DIAS.map((d, i) => h("input", { type: "checkbox", checked: (v || []).includes(i + 1) }));
        ctl[c.clave] = () => cs.map((x, i) => x.checked ? i + 1 : 0).filter(Boolean);
        nodo = h("div", { class: "campo" }, c.etiqueta, h("div", { class: "dias" }, DIAS.map((d, i) => h("label", {}, cs[i], d))));
      } else if (c.tipo === "multi") {
        const cs = c.opciones.map(([val]) => h("input", { type: "checkbox", checked: (v || []).includes(val) }));
        ctl[c.clave] = () => c.opciones.map(([val], i) => cs[i].checked ? val : null).filter(Boolean);
        nodo = h("div", { class: "campo" }, c.etiqueta, c.opciones.map(([, txt], i) => h("label", { class: "marca-check" }, cs[i], txt)));
      } else if (c.tipo === "color") {
        let elegido = String(v || PALETA[0]).toUpperCase();
        const botones = PALETA.map(col => h("button", { type: "button", "aria-label": "Color " + col, style: "background:" + col, class: col === elegido ? "elegido" : "",
          onclick: e => { elegido = col; botones.forEach(b => b.classList.toggle("elegido", b === e.currentTarget)); } }));
        ctl[c.clave] = () => elegido;
        nodo = h("div", { class: "campo" }, c.etiqueta, h("div", { class: "paleta" }, botones));
      } else if (c.tipo === "dinero") {
        const i = h("input", { type: "text", id: "f-" + c.clave, inputMode: "decimal", placeholder: c.placeholder || "" });
        i.value = v === null || v === undefined ? "" : String(v).replace(".", ","); ctl[c.clave] = () => i.value.trim();
        nodo = h("label", { class: "campo" }, c.etiqueta, i);
      } else if (c.tipo === "area") {
        const t = h("textarea", { rows: 3, id: "f-" + c.clave }); t.value = v || ""; ctl[c.clave] = () => t.value.trim();
        nodo = h("label", { class: "campo" }, c.etiqueta, t);
      } else {
        const i = h("input", { type: c.tipo || "text", id: "f-" + c.clave, inputMode: c.tipo === "tel" || c.tipo === "number" ? "numeric" : null });
        i.value = v === null || v === undefined ? "" : v; ctl[c.clave] = () => i.value.trim();
        nodo = h("label", { class: "campo" }, c.etiqueta, i);
      }
      cuerpo.append(nodo);
      if (c.ayuda) cuerpo.append(h("p", { class: "suave" }, c.ayuda));
    }
    const err = h("div", { class: "error-caja", hidden: true });
    const enviar = () => {
      const val = {}; for (const c of campos) val[c.clave] = ctl[c.clave]();
      const falta = campos.find(c => c.obligatorio && (val[c.clave] === "" || val[c.clave] === null));
      if (falta) { err.textContent = "Falta: " + falta.etiqueta; err.hidden = false; return; }
      resuelto = true; cerrar(); resolver(val);
    };

async function comprimirFoto(archivo) {
  let img;
  try { img = await createImageBitmap(archivo); }
  catch { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(archivo); }); }
  const max = 1280, esc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.7));
}

  const lista = h("div", { class: "lista-simple" });

    let cons = sb.from("vendedoras").select("*").order("nombre").limit(100);
    if (t) cons = cons.or(d && d.length === t.length ? `telefono.like.*${d}*` : `nombre.ilike.*${t}*`);
    const vs = ok(await cons);
    pon(lista, ...(vs.length ? vs.map(v => h("div", { class: "pila", style: "gap:8px" },
      h("div", {}, h("strong", {}, v.nombre), h("div", { class: "suave" }, v.telefono || "sin celular")),

        h("button", { class: "btn sec chico", onclick: () => copiar(enlaceVendedora(v), "Enlace copiado") }, "Copiar enlace"),
        h("a", { class: "btn sec chico", href: enlaceVendedora(v), target: "_blank", rel: "noopener" }, "Ver su página"),
        v.telefono ? h("a", { class: "btn sec chico", target: "_blank", rel: "noopener",
          href: `https://wa.me/${telWhatsapp(v.telefono)}?text=${encodeURIComponent("Hola " + v.nombre + ", este es tu enlace de Bunny Express para ver tus paquetes y códigos de retiro:\n" + enlaceVendedora(v))}` }, "Enviar por WhatsApp") : null,
        E.perfil.rol === "admin" ? h("button", { class: "btn rojo chico", onclick: () => intentar(async () => {

        }) }, "Enlace nuevo") : null))) : [h("p", { class: "suave" }, "No hay vendedoras con ese nombre.")]));

VISTAS.fotos = async function (m) {
  const cab = volverMas("Limpiar fotos antiguas");
  const dias = ajusteNum("dias_borrar_fotos", 15);
  const corte = new Date(Date.now() - dias * 86400000).toISOString();
  const buscar = async () => ok(await sb.from("fotos").select("id,ruta,paquetes!inner(estado,cerrado_en)")
    .is("eliminada_en", null).in("paquetes.estado", ["entregado", "devuelto", "anulado"]).lt("paquetes.cerrado_en", corte).limit(200));
  const fs = await buscar();
  const boton = h("button", { class: "btn ancho", id: "fotos-limpiar", disabled: !fs.length }, fs.length ? `Borrar ${fs.length}${fs.length === 200 ? "+" : ""} foto(s)` : "No hay fotos para borrar");
  boton.addEventListener("click", () => intentar(async () => {
    let total = 0, lote = fs;
    while (lote.length) {
      ok(await sb.storage.from("fotos").remove(lote.map(f => f.ruta)));

  pon(m, cab,
    h("div", { class: "tarjeta" },
      h("p", {}, `Se borran las fotos de paquetes entregados, devueltos o anulados hace más de ${dias} días.`),

      if (t && !/^[67]\d{7}$/.test(t)) throw new Error("El celular debe tener 8 números y empezar con 6 o 7.");
      const r = ok(await sb.rpc("guardar_clienta", { p_enlace: enlace, p_codigo: p.codigo, p_nombre: ali.value, p_celular: t }));
      Object.assign(p, { cliente_nombre: r.cliente_nombre, cliente_tel: r.cliente_tel });
      toast("Guardado", "bien"); pintar();
    }, guardar));
    return h("div", { class: "tarjeta" },
      h("div", { class: "fila" }, h("span", { class: "cod crece" }, p.codigo), chipSituacion(p.situacion)),
      h("div", { class: "fila" }, h("span", { class: "chip" }, h("span", { class: "punto", style: "background:" + p.color }), "→ " + p.destino),
        p.codigo_anterior ? h("span", { class: "suave" }, "antes " + p.codigo_anterior) : null),
      h("div", {}, p.situacion.texto),
      p.recogio ? h("div", { class: "suave" }, "Lo recogió: " + p.recogio) : null,
      p.motivo ? h("div", { class: "suave" }, "Motivo: " + p.motivo) : null,
      p.fotos.length ? h("div", { class: "fotos" }, p.fotos.map(r => h("a", { href: urlFoto(r), target: "_blank", rel: "noopener" }, h("img", { src: urlFoto(r), alt: "Foto de " + p.codigo, loading: "lazy" })))) : null,
      p.retiro ? h("div", { class: "ok-caja fila", style: "justify-content:space-between" }, h("span", {}, "Código de retiro"), h("span", { class: "cod" }, p.retiro)) : null,
      p.retiro ? h("div", { class: "suave" }, Number(p.por_cobrar) > 0 ? "Almacenaje a pagar al recoger: " + bs(p.por_cobrar) : "Almacenaje pagado ✓") : null,
      p.retiro ? h("div", { class: "campo" }, "Tu clienta", h("div", { class: "fila" }, h("span", { class: "crece" }, ali), h("span", { class: "crece" }, cel), guardar)) : null,
      p.retiro ? h("div", { class: "fila" },
        h("a", { class: "btn verde chico crece", href: `https://wa.me/${tel}?text=` + encodeURIComponent(msgClienta), target: "_blank", rel: "noopener" },
          tel ? "Enviar a " + (p.cliente_nombre || p.cliente_tel) : "Enviar a mi clienta"),
        h("button", { class: "btn sec chico", onclick: () => copiar(msgClienta, "Mensaje copiado") }, "Copiar")) : null);
  };
  const pintar = () => {
    const t = limpiarCodigo(filtro.value);
    const ps = d.paquetes.filter(p => !t || p.codigo.includes(t) || (p.codigo_anterior || "").includes(t) || (p.retiro || "") === t);
    const activos = ps.filter(p => p.retiro), cerrados = ps.filter(p => !p.retiro);
    pon(lista, 
      activos.length ? h("h2", {}, "Por recoger") : null, ...activos.map(tarjeta),
      cerrados.length ? h("h2", {}, "Entregados y devueltos (últimos 30 días)") : null, ...cerrados.map(tarjeta),
      ps.length ? null : h("p", { class: "suave" }, t ? "Ningún paquete con ese código." : "Todavía no tienes paquetes en Bunny Express."));
  };
  filtro.addEventListener("input", pintar);
  marcoPublico("Bunny Express",
    h("h1", {}, d.vendedora),
    h("div", { class: "rejilla2" },
      h("div", { class: "tarjeta" }, h("span", { class: "suave" }, "Listos para recoger"), h("span", { class: "numero-grande", style: "color:var(--bien)" }, cuenta("listo"))),
      h("div", { class: "tarjeta" }, h("span", { class: "suave" }, "En camino o por salir"), h("span", { class: "numero-grande", style: "color:var(--aviso)" }, cuenta("camino") + cuenta("preparando")))),
    h("p", { class: "suave" }, "Toca “Enviar a mi clienta” para mandarle su código de retiro por WhatsApp."),
    filtro,
    h("button", { class: "btn sec ancho", onclick: () => paginaVendedora(enlace) }, "Actualizar"),
    lista);
  pintar();
}
function paginaConsulta(inicial) {
  const cod = h("input", { type: "text", id: "consulta-codigo", class: "codigo", inputMode: "numeric", maxLength: 6, placeholder: "000000" });
  const res = h("div", { class: "pila", id: "consulta-resultado" });
  const boton = h("button", { class: "btn ancho", id: "consulta-boton" }, "Consultar");
  const consultar = () => intentar(async () => {
    const c = soloDigitos(cod.value);
    if (c.length !== 6) throw new Error("El código de retiro tiene 6 números.");
    const ps = ok(await sb.rpc("consultar_retiro", { p_codigo: c }));
    pon(res, ...(ps.length ? ps.map(p => h("div", { class: "tarjeta" },
      h("div", { class: "fila" }, h("span", { class: "cod crece" }, p.codigo), chipSituacion(p.situacion)),
      h("div", { class: "destino-grande", style: "background:" + p.color }, "→ " + p.destino),
      h("div", { style: "font-size:18px;font-weight:700" }, p.situacion.texto),
      p.por_cobrar !== null && p.por_cobrar !== undefined ? h("div", { class: Number(p.por_cobrar) > 0 ? "aviso-caja" : "ok-caja" },
        Number(p.por_cobrar) > 0 ? "Almacenaje a pagar al recoger: " + bs(p.por_cobrar) + " (efectivo o QR)" : "Almacenaje pagado ✓") : null,
      p.situacion.clave === "listo" ? h("p", { class: "suave" }, "Presenta este código de retiro al recoger. Si mandas a otra persona, dale el código.") : null))
      : [h("div", { class: "aviso-caja" }, "No encontramos paquetes con ese código. Revisa el número o pregunta a tu vendedora.")]));
  }, boton);
  boton.addEventListener("click", consultar);
  cod.addEventListener("keydown", e => { if (e.key === "Enter") consultar(); });
  marcoPublico("Bunny Express",
    h("h1", {}, "¿Dónde está mi paquete?"),
    h("p", { class: "suave" }, "Escribe el código de retiro de 6 números que te dio tu vendedora."),
    h("div", { class: "tarjeta" }, cod, boton), res);
  if (inicial) { cod.value = inicial; consultar(); }
}

const PARAMS = new URLSearchParams(location.search);
if (PARAMS.get("v")) paginaVendedora(PARAMS.get("v"));
else if (PARAMS.has("c")) paginaConsulta(soloDigitos(PARAMS.get("c")));
else iniciar();
</script>
